name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs this via deploy.yml
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4 # Firestore emulator
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src scripts
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
