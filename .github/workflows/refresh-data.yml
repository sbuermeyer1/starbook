name: Refresh restaurant data

on:
  schedule:
    - cron: '17 6 5 * *' # 06:17 UTC on the 5th; upstream usually updates in the first days of the month
  workflow_dispatch:
    inputs:
      allow_mass_change:
        description: Accept a refresh that adds or retires more than 5% of restaurants (check the upstream file first)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh from upstream
        run: node scripts/build-data.ts ${{ inputs.allow_mass_change && '--allow-mass-change' || '' }} | tee refresh.log
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/registry.jsonl; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes upstream."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry.jsonl
          git commit -m "Refresh restaurant data $(date -u +%F)" -m "$(grep -E '^(snapshot|  )' refresh.log | head -40)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN doesn't trigger other workflows, so deploy explicitly.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
