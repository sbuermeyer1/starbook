name: Deploy

on:
  push:
    branches: [main]
  workflow_call: # from refresh-data.yml, after it commits new data
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  hosting:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # a refresh run has just pushed a new commit to main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Hosting only. Firestore rules are deployed by hand (firebase deploy --only firestore:rules)
      # so a rules change is always a deliberate act.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STARBOOK_3298E }}
          projectId: starbook-3298e
          channelId: live
